<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/4b8b4f1d6d.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
    <div class="logo">ShopEasy</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="cart">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
    </div>
</header>

<section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Best Deals Every Day</p>
    <button>Shop Now</button>
</section>

<section class="products" id="products">

    <div class="card">
        <img src="https://picsum.photos/300/200?1" alt="">
        <h3>Wireless Headphones</h3>
        <p>$49</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?2" alt="">
        <h3>Smart Watch</h3>
        <p>$99</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?3" alt="">
        <h3>Gaming Mouse</h3>
        <p>$39</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?4" alt="">
        <h3>Laptop Backpack</h3>
        <p>$59</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

</section>

<footer>
    <p>© 2026 ShopEasy. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
